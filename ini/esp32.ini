#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      ESP32 Architecture       #
#                               #
#################################

#
# Espressif ESP32
#
#ref: https://github.com/platformio/platform-espressif32/issues/710
[env:esp32]
platform = https://github.com/tasmota/platform-espressif32/releases/download/v2.0.2.3/platform-espressif32-2.0.2.3.zip
platform_packages = framework-arduinoespressif32 @ https://github.com/Jason2866/esp32-arduino-lib-builder/releases/download/728/framework-arduinoespressif32-v4.4_dev-d3c108c910.tar.gz

board         = esp32dev
build_src_flags   = ${common.build_flags} -DCORE_DEBUG_LEVEL=0
build_src_filter  = ${common.default_src_filter} +<src/HAL/ESP32> -<src/HAL/ESP32S3>
lib_ignore    = NativeEthernet
upload_speed  = 115200
monitor_speed = 115200
#upload_port   = marlinesp.local
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

[env:FYSETC_E4]
extends                = env:esp32
board_build.partitions = default_16MB.csv

[env:PANDA]
extends       = env:esp32
build_flags   = ${env:esp32.build_flags} -DUSE_ESP32_EXIO -DUSE_ESP32_TASK_WDT
lib_deps      = ${common.lib_deps}
  SoftwareSerialEsp32
board_build.partitions = Marlin/src/HAL/ESP32/esp32.csv
upload_speed  = 115200
monitor_speed = 115200

[env:mks_tinybee]
extends                = env:esp32
board_build.partitions = default_8MB.csv
